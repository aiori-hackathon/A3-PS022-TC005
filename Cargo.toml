[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gen", "crates/bench"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/DebanganMALI/Segfault"
publish = false

[workspace.dependencies]
segfault-core = { path = "crates/core" }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
