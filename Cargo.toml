[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gen", "crates/bench"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/DebanganMALI/Segfault"
publish = false

[workspace.dependencies]
segfault-core = { path = "crates/core" }
segfault-gen = { path = "crates/gen" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libbpf-rs = "0.25"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
