# Lab resolver: answers *.lab.test (legit probes), NXDOMAINs random *.flood.test (shows the cost model).
# Single-threaded on purpose so an unfiltered flood actually degrades legitimate service.
# Runs in the foreground when started by hand: sudo unbound -d -c lab/dns/unbound.conf
server:
    interface: 10.53.0.10
    interface: fd53::10
    port: 53
    do-ip6: yes
    access-control: 10.53.0.0/24 allow
    access-control: fd53::/64 allow
    num-threads: 1
    so-rcvbuf: 1m
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    pidfile: "/tmp/unbound-segfault.pid"
    logfile: ""
    verbosity: 1
    hide-identity: yes
    hide-version: yes
    # DNS Cookies with a shared secret so Segfault can validate server cookies in XDP (RFC 9018).
    answer-cookie: yes
    cookie-secret: "000102030405060708090a0b0c0d0e0f"
    # Every name under lab.test resolves (legitimate probes always get an answer).
local-zone: "lab.test." redirect
local-data: "lab.test. IN A 10.53.0.100"
    # Only the apex of flood.test resolves; random subdomains return NXDOMAIN.
local-zone: "flood.test." static
local-data: "flood.test. IN A 10.53.0.200"
