# Local authoritative upstream for flood.test (realistic water-torture only).
# Apex resolves; every random subdomain returns NXDOMAIN. The main resolver forwards here,
# so each unique *.flood.test query costs a real recursive lookup instead of a local answer.
server:
    interface: 127.0.0.1
    port: 5353
    do-ip6: no
    access-control: 127.0.0.0/8 allow
    num-threads: 1
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    pidfile: "/tmp/unbound-auth.pid"
    logfile: ""
    verbosity: 1
local-zone: "flood.test." static
local-data: "flood.test. IN A 10.53.0.200"
