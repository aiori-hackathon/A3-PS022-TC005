# Realistic water-torture resolver: flood.test is RECURSED to a local authoritative (:5353),
# so each random *.flood.test is a genuine cache-miss that consumes a recursion slot and CPU.
# lab.test still answers locally and instantly (legitimate probes are unaffected).
# Use with lab/dns/unbound-auth.conf; start both via lab/dns/recurse-up.sh.
server:
    interface: 10.53.0.10
    interface: fd53::10
    port: 53
    do-ip6: yes
    access-control: 10.53.0.0/24 allow
    access-control: fd53::/64 allow
    num-threads: 1
    so-rcvbuf: 1m
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    pidfile: "/tmp/unbound-segfault.pid"
    logfile: ""
    verbosity: 1
    hide-identity: yes
    hide-version: yes
    answer-cookie: yes
    cookie-secret: "000102030405060708090a0b0c0d0e0f"
    # Allow forwarding to the loopback authoritative.
    do-not-query-localhost: no
    # Cap outstanding recursion so a water-torture flood realistically exhausts the slots.
    num-queries-per-thread: 512
    # Legitimate probes always get an instant local answer.
local-zone: "lab.test." redirect
local-data: "lab.test. IN A 10.53.0.100"
    # Override unbound's built-in RFC 6761 "test." static zone so flood.test is actually forwarded.
local-zone: "flood.test." transparent
# flood.test is delegated to the local authoritative: random names cost a real recursive lookup.
forward-zone:
    name: "flood.test."
    forward-addr: 127.0.0.1@5353
